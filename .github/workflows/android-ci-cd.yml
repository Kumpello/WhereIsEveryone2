name: Android CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Configure Gradle memory limits for CI
        run: |
          cat >> gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3200m -XX:MaxMetaspaceSize=1024m
          kotlin.daemon.jvmargs=-Xmx3200m
          org.gradle.parallel=false
          EOF

      - name: Run unit tests (development)
        run: ./gradlew testDevelopmentDebugUnitTest --stacktrace

      - name: Run unit tests (production)
        run: ./gradlew testProductionDebugUnitTest --stacktrace

      - name: Run unit tests (production premium)
        run: ./gradlew testProductionPremiumDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Configure Gradle memory limits for CI
        run: |
          cat >> gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3200m -XX:MaxMetaspaceSize=1024m
          kotlin.daemon.jvmargs=-Xmx3200m
          org.gradle.parallel=false
          EOF

      - name: Lint (development)
        run: ./gradlew lintDevelopmentDebug --stacktrace

      - name: Lint (production)
        run: ./gradlew lintProductionDebug --stacktrace

      - name: Lint (production premium)
        run: ./gradlew lintProductionPremiumDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'

  deploy:
    name: Deploy to Google Play (internal)
    needs: [ test, lint ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Configure Gradle memory limits for CI
        run: |
          cat >> gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3200m -XX:MaxMetaspaceSize=1024m
          kotlin.daemon.jvmargs=-Xmx3200m
          org.gradle.parallel=false
          EOF

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build release App Bundle (production)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleProductionRelease --stacktrace

      - name: Build release App Bundle (production premium)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleProductionPremiumRelease --stacktrace

      - name: Upload Production to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kumpello.whereiseveryone
          releaseFiles: app/build/outputs/bundle/productionRelease/app-production-release.aab
          track: internal
          status: completed

      - name: Upload Premium to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kumpello.whereiseveryone.premium
          releaseFiles: app/build/outputs/bundle/productionPremiumRelease/app-productionPremium-release.aab
          track: internal
          status: completed